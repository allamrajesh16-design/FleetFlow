openapi: 3.0.3
info:
  title: FleetFlow API
  version: 1.0.0
  description: Smart Vehicle Fleet & Trip Management Platform API
paths:
  /api/auth/approvals/:
    get:
      operationId: auth_approvals_list
      description: Admin sees pending FLEET_MANAGER and DRIVER requests. Fleet Manager
        sees only pending DRIVER requests.
      summary: List Pending Approvals
      tags:
      - Auth Approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/auth/approvals/{user_id}/approve/:
    post:
      operationId: auth_approvals_approve_create
      description: Admin can approve Fleet Manager or Driver. Fleet Manager can approve
        only Driver.
      summary: Approve User Request
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Auth Approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/approvals/{user_id}/reject/:
    post:
      operationId: auth_approvals_reject_create
      description: Admin can reject Fleet Manager or Driver. Fleet Manager can reject
        only Driver.
      summary: Reject User Request
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Auth Approvals
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ApprovalAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/approvals/{user_id}/resend-decision-email/:
    post:
      operationId: auth_approvals_resend_decision_email_create
      description: Admin can resend decision email for Fleet Manager or Driver. Fleet
        Manager can resend only for Driver.
      summary: Resend Decision Email
      parameters:
      - in: path
        name: user_id
        schema:
          type: integer
        required: true
      tags:
      - Auth Approvals
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: Change password for current logged-in user with old password verification.
      summary: Change Password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Password changed successfully
        '400':
          description: Validation error
  /api/auth/check-email/:
    post:
      operationId: auth_check_email_create
      description: Checks if an email is properly formatted, not a temporary/disposable
        domain, and exists via DNS MX/A lookup.
      summary: Check Email Validity
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckEmail'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: 'Returns {valid: true} or {valid: false, message: ...}'
  /api/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      description: Send a 6-digit password reset code to the user's email. Returns
        a consistent 200 response with seconds_left for cooldown.
      summary: Forgot Password - Request Reset Code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPassword'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Generic confirmation response
        '429':
          description: Rate limit exceeded
  /api/auth/forgot-password/reset/:
    post:
      operationId: auth_forgot_password_reset_create
      description: Set new password using single-use reset token. Invalidates all
        active sessions.
      summary: Forgot Password - Reset Password
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordConfirm'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Password successfully updated
        '400':
          description: Invalid or expired reset token
  /api/auth/forgot-password/verify-otp/:
    post:
      operationId: auth_forgot_password_verify_otp_create
      description: Verify the 6-digit reset code and obtain a single-use short-lived
        reset session token.
      summary: Forgot Password - Verify Reset Code
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyResetOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyResetOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyResetOTP'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Reset token issued
        '400':
          description: Invalid or expired code
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: Login with registered email or phone and password. Verifies email
        verification and approval status.
      summary: User Login
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: JWT token pair and user profile details
        '400':
          description: Invalid credentials
        '403':
          description: Unverified or Pending/Rejected status
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklists the provided refresh token and invalidates the session.
        Always returns HTTP 200.
      summary: User Logout
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Logout'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Logout'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Logout'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Logged out successfully
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: Retrieve profile details for current logged-in user.
      summary: Get User Profile
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
    put:
      operationId: auth_profile_update
      description: Update profile details (full_name and phone only) for current logged-in
        user.
      summary: Update User Profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserProfile'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
    patch:
      operationId: auth_profile_partial_update
      description: Patch profile details (full_name and phone only) for current logged-in
        user.
      summary: Patch User Profile
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfile'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          description: Validation error
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Public registration for Customer, Fleet Manager, Driver, and initial
        Admin. Sends an OTP to email.
      summary: User Registration
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          description: OTP sent to your email
        '400':
          description: Validation error
  /api/auth/register-options/:
    get:
      operationId: auth_register_options_retrieve
      description: Returns list of roles allowed for registration. ADMIN is only included
        if no active admin exists.
      summary: Get registration role options
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: List of allowed roles
  /api/auth/resend-otp/:
    post:
      operationId: auth_resend_otp_create
      description: Resend a fresh OTP to user's email. Requires at least 60 seconds
        since the last OTP was sent.
      summary: Resend Email OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResendOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResendOTP'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: OTP resent
        '400':
          description: Rate limited or already verified
  /api/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      description: Deprecated endpoint. Informs users that link-based reset is replaced
        by email OTP.
      summary: Reset Password (Deprecated)
      tags:
      - Auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '400':
          description: Deprecated reset link
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/verify-otp/:
    post:
      operationId: auth_verify_otp_create
      description: Verify OTP received on registered email. Activates Customer/Admin
        or queues Fleet Manager/Driver for approval.
      summary: Verify Email OTP
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/VerifyOTP'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: Verification result
        '400':
          description: Invalid or expired OTP
  /api/bookings/:
    get:
      operationId: bookings_list
      description: List bookings with filters and search. Customers see only their
        own. Staff see all.
      summary: List bookings
      parameters:
      - in: query
        name: booking_type
        schema:
          type: string
      - in: query
        name: date_from
        schema:
          type: string
          format: date
      - in: query
        name: date_to
        schema:
          type: string
          format: date
      - in: query
        name: has_trip
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      - in: query
        name: travel_datetime_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: travel_datetime_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: vehicle_type
        schema:
          type: string
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      description: Create a vehicle or bus seat booking (Customer only).
      summary: Create a booking
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Booking'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Booking'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Booking'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      description: Get details of a specific booking.
      summary: Retrieve booking details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/approve/:
    post:
      operationId: bookings_approve_create
      description: Approve a pending VEHICLE booking (Admin and Fleet Manager only).
      summary: Approve booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingApprove'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingApprove'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingApprove'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/bus-response/:
    post:
      operationId: bookings_bus_response_create
      description: Choose alternative vehicle, cancellation, or refund when bus schedule
        was cancelled.
      summary: Respond to cancelled bus schedule
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingBusResponse'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingBusResponse'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingBusResponse'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/cancel/:
    post:
      operationId: bookings_cancel_create
      description: Cancel own booking before travel datetime (Customer only).
      summary: Cancel booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancel'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancel'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/reject/:
    post:
      operationId: bookings_reject_create
      description: Reject a pending booking with a reason (Admin and Fleet Manager
        only).
      summary: Reject booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingReject'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingReject'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingReject'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
          description: ''
  /api/bookings/{id}/tracking/:
    get:
      operationId: bookings_tracking_retrieve
      description: Retrieve real-time tracking information, status steps, driver/vehicle
        details, and GPS coordinates (customer owner only).
      summary: Live trip tracking for booking
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Booking.
        required: true
      tags:
      - Bookings
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingTracking'
          description: ''
  /api/bus-schedules/:
    get:
      operationId: bus_schedules_list
      description: List bus schedules. Customers see OPEN or CONFIRMED future schedules.
        Staff see all.
      summary: List bus schedules
      parameters:
      - in: query
        name: departure_date
        schema:
          type: string
          format: date
      - in: query
        name: departure_gte
        schema:
          type: string
          format: date-time
      - in: query
        name: departure_lte
        schema:
          type: string
          format: date-time
      - in: query
        name: destination
        schema:
          type: string
      - in: query
        name: has_trip
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
      tags:
      - Bus Schedules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBusScheduleList'
          description: ''
    post:
      operationId: bus_schedules_create
      description: Add a new bus schedule (Admin and Fleet Manager only).
      summary: Create bus schedule
      tags:
      - Bus Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusSchedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusSchedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusSchedule'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusSchedule'
          description: ''
  /api/bus-schedules/{id}/:
    get:
      operationId: bus_schedules_retrieve
      description: Get detailed information about a bus schedule.
      summary: Retrieve bus schedule
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Bus Schedule.
        required: true
      tags:
      - Bus Schedules
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusSchedule'
          description: ''
    put:
      operationId: bus_schedules_update
      description: Update a bus schedule (Admin and Fleet Manager only).
      summary: Update bus schedule
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Bus Schedule.
        required: true
      tags:
      - Bus Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusSchedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BusSchedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BusSchedule'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusSchedule'
          description: ''
    patch:
      operationId: bus_schedules_partial_update
      description: Partially update a bus schedule (Admin and Fleet Manager only).
      summary: Partial update bus schedule
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Bus Schedule.
        required: true
      tags:
      - Bus Schedules
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBusSchedule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBusSchedule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBusSchedule'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusSchedule'
          description: ''
    delete:
      operationId: bus_schedules_destroy
      description: Delete a bus schedule (Admin and Fleet Manager only).
      summary: Delete bus schedule
      parameters:
      - in: path
