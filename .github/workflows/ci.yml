name: FleetFlow CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fleetflow_test_db
          POSTGRES_USER: fleetflow_user
          POSTGRES_PASSWORD: test_password_123
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install coverage

      - name: Validate Environment Fast-Fail
        env:
          SECRET_KEY: ci-testing-secret-key-must-be-long-enough-32-chars
          DB_NAME: fleetflow_test_db
          DB_USER: fleetflow_user
          DB_PASSWORD: test_password_123
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          EMAIL_HOST_USER: test@fleetflow.local
          EMAIL_HOST_PASSWORD: ci_test_password
          JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters
        run: |
          cd backend
          python -c "from config.env_check import validate_environment; validate_environment()"

      - name: Run Backend Tests with Coverage
        env:
          SECRET_KEY: ci-testing-secret-key-must-be-long-enough-32-chars
          DB_NAME: fleetflow_test_db
          DB_USER: fleetflow_user
          DB_PASSWORD: test_password_123
          DB_HOST: localhost
          DB_PORT: 5432
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:3000
          EMAIL_HOST_USER: test@fleetflow.local
          EMAIL_HOST_PASSWORD: ci_test_password
          JWT_SECRET_KEY: ci-jwt-secret-key-minimum-32-characters
        run: |
          cd backend
          coverage run --source=accounts,bookings,trips,payments,vehicles,drivers manage.py test
          coverage report --fail-under=80

  frontend-tests:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install

      - name: Run Frontend Tests (Jest)
        env:
          CI: true
        run: |
          cd frontend
          npm test -- --watchAll=false

  security-scan:
    name: Security & Secrets Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Secrets Scanner
        run: |
          python scripts/scan_secrets.py

