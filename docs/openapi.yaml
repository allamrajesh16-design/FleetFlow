      description: |-
        * `UNPAID` - Unpaid
        * `PAYMENT_INITIATED` - Payment Initiated
        * `PAID` - Paid
        * `FAILED` - Failed
        * `EXPIRED` - Expired
        * `REFUNDED` - Refunded
    PaymentSummary:
      type: object
      description: Summary metrics of all payments.
      properties:
        total_collected:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        pending_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        failed_count:
          type: integer
        refunded_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - failed_count
      - pending_amount
      - refunded_amount
      - total_collected
    PaymentVerify:
      type: object
      description: Payload for backend signature verification.
      properties:
        payment_id:
          type: integer
        gateway_reference:
          type: string
        gateway_status:
          type: string
        signature:
          type: string
      required:
      - gateway_reference
      - gateway_status
      - payment_id
      - signature
    Receipt:
      type: object
      description: Serializer for Receipt.
      properties:
        id:
          type: integer
          readOnly: true
        receipt_number:
          type: string
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
        data:
          readOnly: true
      required:
      - data
      - id
      - issued_at
      - receipt_number
    Register:
      type: object
      description: Serializer for public user registration across allowed roles.
      properties:
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 6
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          default: CUSTOMER
        license_number:
          type: string
          maxLength: 50
        license_expiry:
          type: string
          format: date
          nullable: true
      required:
      - email
      - full_name
      - password
    RejectProof:
      type: object
      description: Payload for rejecting submitted payment proof.
      properties:
        reason:
          type: string
      required:
      - reason
    ReportResponse:
      type: object
      properties:
        summary:
          type: object
          additionalProperties: {}
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        rows:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - rows
      - summary
    ResendOTP:
      type: object
      description: Serializer for resending email OTP.
      properties:
        email:
          type: string
          format: email
      required:
      - email
    ResetPasswordConfirm:
      type: object
      description: Serializer to reset password using short-lived reset session token.
      properties:
        reset_token:
          type: string
        new_password:
          type: string
          writeOnly: true
          minLength: 6
        confirm_password:
          type: string
          writeOnly: true
          minLength: 6
      required:
      - confirm_password
      - new_password
      - reset_token
    RoleEnum:
      enum:
      - ADMIN
      - FLEET_MANAGER
      - DRIVER
      - CUSTOMER
      type: string
      description: |-
        * `ADMIN` - Admin
        * `FLEET_MANAGER` - Fleet Manager
        * `DRIVER` - Driver
        * `CUSTOMER` - Customer
    StepEnum:
      enum:
      - BOOKED
      - ASSIGNED
      - IN_PROGRESS
      - COMPLETED
      type: string
      description: |-
        * `BOOKED` - BOOKED
        * `ASSIGNED` - ASSIGNED
        * `IN_PROGRESS` - IN_PROGRESS
        * `COMPLETED` - COMPLETED
    SubmitProof:
      type: object
      description: Payload for customer submitting payment transaction reference and
        proof.
      properties:
        transaction_reference:
          type: string
          pattern: ^[A-Za-z0-9]{6,30}$
        proof_screenshot:
          type: string
          format: uri
          nullable: true
      required:
      - transaction_reference
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    Trip:
      type: object
      description: Serializer for Trip details.
      properties:
        id:
          type: integer
          readOnly: true
        booking:
          type: integer
          nullable: true
        bus_schedule:
          type: integer
          nullable: true
        vehicle:
          type: integer
        vehicle_registration:
          type: string
          readOnly: true
          nullable: true
        vehicle_type:
          type: string
          readOnly: true
          nullable: true
        vehicle_brand_model:
          type: string
          readOnly: true
        driver:
          type: integer
        driver_name:
          type: string
          readOnly: true
          nullable: true
        driver_license:
          type: string
          readOnly: true
          nullable: true
        source:
          type: string
          maxLength: 255
        destination:
          type: string
          maxLength: 255
        pickup_location:
          type: string
          readOnly: true
          default: ''
        drop_location:
          type: string
          readOnly: true
          default: ''
        customer_name:
          type: string
          nullable: true
          readOnly: true
        customer_email:
          type: string
          format: email
          nullable: true
          readOnly: true
        passengers:
          type: integer
          readOnly: true
        scheduled_datetime:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/TripStatusEnum'
        start_odometer:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        end_odometer:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        distance_km:
          type: integer
          readOnly: true
        started_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        total_fare:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        last_known_location:
          allOf:
          - $ref: '#/components/schemas/TripLocation'
          readOnly: true
        assigned_by:
          type: integer
          readOnly: true
          nullable: true
        assigned_by_name:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_by
      - assigned_by_name
      - completed_at
      - created_at
      - customer_email
      - customer_name
      - destination
      - distance_km
      - driver
      - driver_license
      - driver_name
      - drop_location
      - id
      - last_known_location
      - passengers
      - pickup_location
      - scheduled_datetime
      - source
      - started_at
      - total_fare
      - updated_at
      - vehicle
      - vehicle_brand_model
      - vehicle_registration
      - vehicle_type
    TripAssign:
      type: object
      description: Payload for assigning a vehicle and driver to a trip.
      properties:
        booking:
          type: integer
          nullable: true
        bus_schedule:
          type: integer
          nullable: true
        vehicle:
          type: integer
        driver:
          type: integer
        source:
          type: string
        destination:
          type: string
        scheduled_datetime:
          type: string
          format: date-time
      required:
      - driver
      - vehicle
    TripComplete:
      type: object
      description: Payload for completing a trip with final odometer reading.
      properties:
        end_odometer:
          type: integer
          minimum: 1
      required:
      - end_odometer
    TripLocation:
      type: object
      description: Serializer for Trip Location coordinates.
      properties:
        id:
          type: integer
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        recorded_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - latitude
      - longitude
      - recorded_at
    TripLocationTracking:
      type: object
      description: Coordinates and timestamp of recorded driver GPS location.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        recorded_at:
          type: string
          format: date-time
      required:
      - latitude
      - longitude
      - recorded_at
    TripLocationUpdate:
      type: object
      description: Payload for driver live location updates.
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      required:
      - latitude
      - longitude
    TripStart:
      type: object
      description: Payload for starting a trip with initial odometer reading.
      properties:
        start_odometer:
          type: integer
          minimum: 1
      required:
      - start_odometer
    TripStatusEnum:
      enum:
      - SCHEDULED
      - IN_PROGRESS
      - COMPLETED
      - CANCELLED
      type: string
      description: |-
        * `SCHEDULED` - Scheduled
        * `IN_PROGRESS` - In Progress
        * `COMPLETED` - Completed
        * `CANCELLED` - Cancelled
    TripSummary:
      type: object
      description: Overall trips summary for dashboard.
      properties:
        total_trips:
          type: integer
        active_trips:
          type: integer
        scheduled_trips:
          type: integer
        completed_trips:
          type: integer
        cancelled_trips:
          type: integer
      required:
      - active_trips
      - cancelled_trips
      - completed_trips
      - scheduled_trips
      - total_trips
    User:
      type: object
      description: Serializer for User representation.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_active:
          type: boolean
          readOnly: true
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        is_email_verified:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        rejection_reason:
          type: string
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - created_at
      - email
      - full_name
      - id
      - is_active
      - is_email_verified
      - rejection_reason
      - role
      - updated_at
    UserAdminCreate:
      type: object
      description: Serializer for Admin creating a user (ADMIN, FLEET_MANAGER, CUSTOMER).
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        name:
          type: string
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          nullable: true
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        password:
          type: string
          writeOnly: true
          minLength: 6
        is_active:
          type: boolean
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - password
    UserAdminUpdate:
      type: object
      description: Serializer for Admin updating user details, phone, role, is_active.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        name:
          type: string
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_active:
          type: boolean
          title: Active
          description: Designates whether this user should be treated as active. Unselect
            this instead of deleting accounts.
        password:
          writeOnly: true
          oneOf:
          - type: string
            minLength: 6
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - id
      - updated_at
    UserProfile:
      type: object
      description: Serializer to view and update user profile.
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          nullable: true
          maxLength: 20
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        is_email_verified:
          type: boolean
          readOnly: true
        approval_status:
          allOf:
          - $ref: '#/components/schemas/ApprovalStatusEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approval_status
      - created_at
      - email
      - full_name
      - id
      - is_email_verified
      - role
      - updated_at
    Vehicle:
      type: object
      description: Serializer for Vehicle model with seating and bus validation.
      properties:
        id:
          type: integer
          readOnly: true
        registration_number:
          type: string
          maxLength: 30
        vehicle_type:
          $ref: '#/components/schemas/BookingVehicleTypeEnum'
        brand:
          type: string
          maxLength: 60
        model:
          type: string
          maxLength: 60
        seating_capacity:
          type: integer
          maximum: 2147483647
          minimum: 1
        min_passengers:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        rate_per_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/VehicleStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - brand
      - created_at
      - id
      - model
      - rate_per_km
      - registration_number
      - seating_capacity
      - updated_at
      - vehicle_type
    VehicleStatusEnum:
      enum:
      - ACTIVE
      - MAINTENANCE
      - ON_TRIP
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `MAINTENANCE` - Maintenance
        * `ON_TRIP` - On Trip
        * `INACTIVE` - Inactive
    VerifyOTP:
      type: object
      description: Serializer for verifying 6-digit email OTP.
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
    VerifyResetOTP:
      type: object
      description: Serializer to verify password reset OTP code.
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          maxLength: 6
          minLength: 6
      required:
      - email
      - otp
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
