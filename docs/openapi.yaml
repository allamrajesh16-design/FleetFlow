components:
  schemas:
    AdminDashboard:
      type: object
      properties:
        total_vehicles:
          type: integer
        total_drivers:
          type: integer
        total_customers:
          type: integer
        total_bookings:
          type: integer
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        revenue_last_6_months:
          type: array
          items:
            type: object
            additionalProperties: {}
        recent_bookings:
          type: array
          items:
            type: object
            additionalProperties: {}
        vehicle_status_counts:
          type: object
          additionalProperties: {}
        trip_status_counts:
          type: object
          additionalProperties: {}
        pending_approvals:
          type: integer
        expiring_documents_count:
          type: integer
          default: 0
        expired_documents_count:
          type: integer
          default: 0
        fuel_cost_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        expenses_this_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          default: '0.00'
        top_cost_vehicles:
          type: array
          items:
            type: object
            additionalProperties: {}
        next_5_expiring_documents:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - pending_approvals
      - recent_bookings
      - revenue
      - revenue_last_6_months
      - total_bookings
      - total_customers
      - total_drivers
      - total_vehicles
      - trip_status_counts
      - vehicle_status_counts
    ApprovalAction:
      type: object
      description: Serializer for rejecting a user request with a required reason.
      properties:
        reason:
          type: string
      required:
      - reason
    ApprovalStatusEnum:
      enum:
      - NOT_REQUIRED
      - PENDING
      - APPROVED
      - REJECTED
